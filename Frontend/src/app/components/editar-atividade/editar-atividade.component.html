<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Editar Atividade</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="fechar()">Fechar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Título</ion-label>
    <ion-input [(ngModel)]="atividade.titulo"></ion-input>
  </ion-item>
  <ion-item>
    <ion-label position="floating">Descrição</ion-label>
    <ion-textarea [(ngModel)]="atividade.descricao" rows="3"></ion-textarea>
  </ion-item>
  <ion-item>
    <ion-label position="stacked">Data de Entrega</ion-label>
    <ion-datetime [(ngModel)]="atividade.dtEntrega" presentation="date-time" locale="pt-BR"></ion-datetime>
  </ion-item>
  <ion-item>
    <ion-label>Disponível</ion-label>
    <ion-toggle [(ngModel)]="atividade.disponivel"></ion-toggle>
  </ion-item>
  <ion-item>
    <ion-label position="floating">Tentativas Máximas</ion-label>
    <ion-input type="number" [(ngModel)]="atividade.tentativasMax" min="1"></ion-input>
  </ion-item>
  <ion-button expand="block" (click)="salvar()" class="ion-margin-top">Salvar</ion-button>
</ion-content>
