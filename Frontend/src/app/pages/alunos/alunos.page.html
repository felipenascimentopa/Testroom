<ion-header [translucent]="true">
    <ion-toolbar color="dark">
        <ion-buttons slot="start">
            <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>Alunos</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
    <ion-searchbar 
        [(ngModel)]="searchTerm" 
        (ionInput)="filtrarAlunos()"
        placeholder="Buscar aluno..."
        showCancelButton="focus">
    </ion-searchbar>

    <ion-list>
        @for (aluno of alunosFiltrados; track aluno.id) {
            <ion-item-sliding>
                <ion-item>
                    <ion-avatar slot="start">
                        <ion-icon name="person" style="font-size: 40px;"></ion-icon>
                    </ion-avatar>
                    <ion-label>
                        <h2>{{ aluno.nome }}</h2>
                        <p>{{ aluno.email }}</p>
                    </ion-label>
                </ion-item>

                <ion-item-options side="end">
                    <ion-item-option (click)="editarAluno(aluno)" color="primary">
                        <ion-icon name="create" slot="icon-only"></ion-icon>
                    </ion-item-option>
                    <ion-item-option (click)="excluirAluno(aluno)" color="danger">
                        <ion-icon name="trash" slot="icon-only"></ion-icon>
                    </ion-item-option>
                </ion-item-options>
            </ion-item-sliding>
        } @empty {
            <div class="ion-text-center ion-padding">
                <p>Nenhum aluno encontrado.</p>
            </div>
        }
    </ion-list>

    <ion-fab vertical="bottom" horizontal="end" slot="fixed">
        <ion-fab-button routerLink="/criar-aluno" color="danger">
            <ion-icon name="add"></ion-icon>
        </ion-fab-button>
    </ion-fab>
</ion-content>
