<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Cadastro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-radio-group [(ngModel)]="tipoUsuario" class="ion-margin-bottom">
    <ion-item>
      <ion-label>Sou aluno</ion-label>
      <ion-radio value="ALUNO" slot="start"></ion-radio>
    </ion-item>
    <ion-item>
      <ion-label>Sou professor</ion-label>
      <ion-radio value="PROFESSOR" slot="start"></ion-radio>
    </ion-item>
  </ion-radio-group>

  <form [formGroup]="formGroup">
    <ion-item>
      <ion-label position="floating">Nome completo</ion-label>
      <ion-input formControlName="nome"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">E-mail</ion-label>
      <ion-input type="email" formControlName="email"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Senha</ion-label>
      <ion-input type="password" formControlName="senha"></ion-input>
    </ion-item>

    <ion-item *ngIf="tipoUsuario === 'PROFESSOR'">
      <ion-label position="floating">Especialidade (opcional)</ion-label>
      <ion-input formControlName="especialidade"></ion-input>
    </ion-item>

    <ion-button expand="block" (click)="cadastrar()" [disabled]="formGroup.invalid" class="ion-margin-top">
      Cadastrar
    </ion-button>
  </form>
</ion-content>
