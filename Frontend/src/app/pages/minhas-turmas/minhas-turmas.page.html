<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Minhas Turmas</ion-title>
    <ion-buttons slot="end" *ngIf="isProfessor">
      <ion-button routerLink="/menu/criar-turma">
        <ion-icon name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="carregarTurmas($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- Estado de carregamento -->
  <div *ngIf="carregando" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <!-- Nenhuma turma -->
  <div *ngIf="!carregando && turmas.length === 0" class="empty-state">
    <ion-icon name="school-outline"></ion-icon>
    <h2>Nenhuma turma encontrada</h2>
    <p *ngIf="isProfessor">Clique no botão + para criar sua primeira turma</p>
    <p *ngIf="!isProfessor">Use o código de acesso na opção "Entrar em Turma"</p>
  </div>

  <ion-list lines="none" class="turma-list">
    <ion-card *ngFor="let turma of turmas" class="turma-card" [routerLink]="['/menu/detalhes-turma', turma.id]">
      <ion-card-header>
        <ion-card-title>{{ turma.nome }}</ion-card-title>
        <ion-card-subtitle>Código: {{ turma.codigoAcesso }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <p>{{ turma.descricao || 'Sem descrição' }}</p>
        <div class="card-footer">
          <ion-badge color="light">
            {{ isDono(turma) ? 'Criada por você' : 'Matriculado' }}
          </ion-badge>
        </div>
      </ion-card-content>
    </ion-card>
  </ion-list>
</ion-content>
