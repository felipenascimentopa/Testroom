<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Criar Turma</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="formGroup" (ngSubmit)="criar()">
    <ion-card>
      <ion-card-content>
        <ion-item>
          <ion-label position="floating">Nome da turma *</ion-label>
          <ion-input formControlName="nome"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="floating">Descrição</ion-label>
          <ion-textarea formControlName="descricao" rows="3"></ion-textarea>
        </ion-item>
      </ion-card-content>
    </ion-card>

    <ion-button type="submit" expand="block" [disabled]="!formGroup.valid" class="create-button">
      Criar Turma
    </ion-button>
  </form>

  <ion-card *ngIf="turmaCriada" class="codigo-card">
    <ion-card-header>
      <ion-card-title>Turma criada com sucesso!</ion-card-title>
      <ion-card-subtitle>Compartilhe o código abaixo com seus alunos</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <div class="codigo">
        {{ turmaCriada.codigoAcesso }}
      </div>
      <ion-button fill="clear" (click)="copiarCodigo()">
        <ion-icon name="copy-outline" slot="start"></ion-icon>
        Copiar código
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
