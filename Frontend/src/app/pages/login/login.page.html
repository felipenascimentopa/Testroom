<ion-header [translucent]="true">
    <ion-toolbar color="dark">
        <ion-title>TestRoom</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
    <div class="ion-text-center">
        <h1 class="logo-text">TestRoom</h1>
        <p>Sistema de Gerenciamento de Turmas</p>
    </div>

    <form [formGroup]="formGroup" (ngSubmit)="autenticar()">
        <ion-item>
            <ion-label position="stacked">Email</ion-label>
            <ion-input type="email" formControlName="email" placeholder="seu@email.com"></ion-input>
        </ion-item>

        <ion-item>
            <ion-label position="stacked">Senha</ion-label>
            <ion-input type="password" formControlName="senha"></ion-input>
        </ion-item>

        <ion-button type="submit" expand="block" color="danger" [disabled]="!formGroup.valid" class="ion-margin-top">
            Entrar
        </ion-button>
    </form>
</ion-content>
