<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="voltar()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ isEdit ? 'Editar Categoria' : 'Nova Categoria' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form-container">
    <ion-item>
      <ion-label position="floating">Nome</ion-label>
      <ion-input [(ngModel)]="categoria.nome" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Descrição (opcional)</ion-label>
      <ion-textarea [(ngModel)]="categoria.descricao" rows="3"></ion-textarea>
    </ion-item>
    <ion-button expand="block" (click)="salvar()" [disabled]="!categoria.nome">Salvar</ion-button>
  </div>
</ion-content>
