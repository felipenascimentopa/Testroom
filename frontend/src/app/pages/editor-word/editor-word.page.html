<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="voltar()"><ion-icon name="arrow-back"></ion-icon></ion-button>
    </ion-buttons>
    <ion-title>Editor</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="alternarTipo()"
                  [color]="tipo === 'gabarito' ? 'warning' : 'medium'"
                  [title]="tipo === 'gabarito' ? 'Voltar para prova' : 'Ver gabarito'">
        <ion-icon slot="start" name="key-outline"></ion-icon>
        {{ tipo === 'gabarito' ? 'Gabarito' : 'Prova' }}
      </ion-button>
      <ion-button (click)="salvar()" [disabled]="salvando">
        <ion-icon slot="start" name="save-outline"></ion-icon>
        Salvar
      </ion-button>
      <ion-button (click)="previewPdf()">
        <ion-icon slot="start" name="eye-outline"></ion-icon>
        PDF
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar class="toolbar">
    <div class="tb-group">
      <button type="button" class="tb" title="Desfazer"
              (mousedown)="manterFoco($event)" (click)="cmd('undo')">
        <ion-icon name="return-down-back-outline"></ion-icon>
      </button>
      <button type="button" class="tb" title="Refazer"
              (mousedown)="manterFoco($event)" (click)="cmd('redo')">
        <ion-icon name="return-down-forward-outline"></ion-icon>
      </button>
    </div>

    <div class="tb-group">
      <select class="tb-select" (change)="formatBlock($any($event.target).value)">
        <option value="p">Parágrafo</option>
        <option value="h1">Título 1</option>
        <option value="h2">Título 2</option>
        <option value="h3">Título 3</option>
        <option value="h4">Título 4</option>
        <option value="blockquote">Citação</option>
      </select>

      <select class="tb-select" title="Tamanho da fonte"
              [value]="fontSizeAtual"
              (change)="aplicarFontSize(+$any($event.target).value)">
        <option *ngFor="let p of tamanhosFonte" [value]="p">{{ p }} pt</option>
      </select>
    </div>

    <div class="tb-group">
      <button type="button" class="tb" title="Negrito"
              (mousedown)="manterFoco($event)" (click)="cmd('bold')">
        <strong>B</strong>
      </button>
      <button type="button" class="tb" title="Itálico"
              (mousedown)="manterFoco($event)" (click)="cmd('italic')">
        <em>I</em>
      </button>
      <button type="button" class="tb" title="Sublinhado"
              (mousedown)="manterFoco($event)" (click)="cmd('underline')">
        <u>U</u>
      </button>
      <button type="button" class="tb" title="Riscado"
              (mousedown)="manterFoco($event)" (click)="cmd('strikeThrough')">
        <s>S</s>
      </button>
    </div>

    <div class="tb-group">
      <label class="tb cor" title="Cor do texto">
        A
        <input type="color" [value]="corTexto"
               (input)="aplicarCorTexto($any($event.target).value)">
      </label>
      <label class="tb cor" title="Cor de fundo">
        ▓
        <input type="color" [value]="corFundo"
               (input)="aplicarCorFundo($any($event.target).value)">
      </label>
    </div>

    <div class="tb-group">
      <button type="button" class="tb" title="Lista com marcadores"
              (mousedown)="manterFoco($event)" (click)="cmd('insertUnorderedList')">
        <ion-icon name="list-outline"></ion-icon>
      </button>
      <button type="button" class="tb" title="Lista numerada"
              (mousedown)="manterFoco($event)" (click)="cmd('insertOrderedList')">
        <ion-icon name="list-circle-outline"></ion-icon>
      </button>
    </div>

    <div class="tb-group">
      <button type="button" class="tb" title="Alinhar à esquerda"
              (mousedown)="manterFoco($event)" (click)="cmd('justifyLeft')">
        <ion-icon name="reorder-two-outline"></ion-icon>
      </button>
      <button type="button" class="tb" title="Centralizar"
              (mousedown)="manterFoco($event)" (click)="cmd('justifyCenter')">
        <ion-icon name="reorder-three-outline"></ion-icon>
      </button>
      <button type="button" class="tb" title="Alinhar à direita"
              (mousedown)="manterFoco($event)" (click)="cmd('justifyRight')">
        <ion-icon name="reorder-four-outline"></ion-icon>
      </button>
    </div>

    <div class="tb-group">
      <button type="button" class="tb" title="Inserir imagem"
              (mousedown)="manterFoco($event)" (click)="inserirImagem()">
        <ion-icon name="image-outline"></ion-icon>
      </button>
      <button type="button" class="tb" title="Inserir link"
              (mousedown)="manterFoco($event)" (click)="inserirLink()">
        <ion-icon name="link-outline"></ion-icon>
      </button>
      <button type="button" class="tb" title="Inserir tabela"
              (mousedown)="manterFoco($event)" (click)="inserirTabela()">
        ⊞
      </button>
      <button type="button" class="tb" title="Limpar formatação"
              (mousedown)="manterFoco($event)" (click)="limparFormatacao()">
        <ion-icon name="remove-outline"></ion-icon>
      </button>
    </div>
  </ion-toolbar>

  <ion-toolbar class="toolbar img-tools" *ngIf="imagemSelecionada">
    <span class="it-label">
      <ion-icon name="image-outline"></ion-icon>
      Tamanho da imagem:
    </span>
    <button type="button" class="tb-btn" (click)="redimensionarImagem(25)">25%</button>
    <button type="button" class="tb-btn" (click)="redimensionarImagem(50)">50%</button>
    <button type="button" class="tb-btn" (click)="redimensionarImagem(75)">75%</button>
    <button type="button" class="tb-btn" (click)="redimensionarImagem(100)">100%</button>
    <span class="sep"></span>
    <button type="button" class="tb-btn danger" (click)="removerImagemSelecionada()">
      <ion-icon name="trash-outline"></ion-icon>
      Remover
    </button>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="workspace">
    <div #editor
         class="pagina"
         [class.gabarito]="tipo === 'gabarito'"
         contenteditable="true"
         spellcheck="false"
         (click)="onEditorClick($event)"></div>
  </div>

  <ion-toast
    [isOpen]="toastAberto"
    [message]="toastMsg"
    [duration]="1600"
    position="bottom"
    (ionDismiss)="toastAberto = false">
  </ion-toast>
</ion-content>
